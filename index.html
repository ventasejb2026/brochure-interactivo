<title>Brochure EJB Contable</title>
<meta name="description" content="Brochure interactivo de EJB Contable: modalidades, precios, guía contable de Perú, situaciones frecuentes y novedades NIIF 18 · 2027."><meta name="color-scheme" content="light"><meta property="og:title" content="Brochure EJB Contable"><meta property="og:description" content="Modalidades, guía contable Perú y novedades NIIF 18 · 2027 de EJB Solutions."><meta property="og:type" content="website"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23001F4B%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2728%27 text-anchor=%27middle%27 fill=%27%23FEA803%27%3EEJB%3C/text%3E%3C/svg%3E"><meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Paleta de marca EJB: azul noche #001F4B, ámbar #FEA803, blanco con contorno #1D1D1B. Layout: cabecera fija con 4 vistas; portada azul noche, bloques blancos con aire, ámbar solo en acciones. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0B1A33; --muted:#4F5D75; --line:#D9DEE8; --outline:#0B1A33;
  --navy:#001F4B; --navy-2:#30428A; --on-navy:#FFFFFF; --on-navy-muted:#BFCBE3;
  --amber:#FEA803; --on-amber:#0B1A33; --ok:#1B7F52; --soft:#EAEEF6; --accent-txt:#1F3C88;
  --f-display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark) and (min-width:99999px){
  :root:not([data-theme="light"]){
    --bg:#00122E; --surface:#04204A; --ink:#EEF2FA; --muted:#A5B2CC; --line:#1B3566; --outline:#8EA3D1;
    --navy:#001F4B; --navy-2:#4A66C2; --soft:#06265A; --ok:#4CC38A; --accent-txt:#FEA803; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#00122E; --surface:#04204A; --ink:#EEF2FA; --muted:#A5B2CC; --line:#1B3566; --outline:#8EA3D1;
  --navy:#001F4B; --navy-2:#4A66C2; --soft:#06265A; --ok:#4CC38A; --accent-txt:#FEA803; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;
}
h1,h2,h3{font-family:var(--f-display); line-height:1.1; margin:0; text-wrap:balance; letter-spacing:-0.01em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px; border-radius:6px}
.wrap{max-width:1040px; margin-inline:auto}

.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--bg);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line);
}
.top .wrap{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; line-height:1; text-decoration:none}
.brand b{font-family:var(--f-display); font-weight:800; font-size:22px}
.brand b i{font-style:normal; font-weight:600; color:var(--accent-txt)}
.brand small{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-top:3px}
.tabs{display:flex; gap:6px; overflow-x:auto; min-width:0; flex:1 1 320px; padding-bottom:2px}
.tab{appearance:none; border:1px solid var(--outline); background:var(--surface); color:var(--ink); font:600 14px var(--f-body); padding:9px 14px; border-radius:999px; cursor:pointer; white-space:nowrap}
.tab[aria-current="true"]{background:var(--navy); color:var(--on-navy); border-color:var(--navy)}
.tab:hover{border-color:var(--navy-2)}

.cover{
  background:var(--navy); color:var(--on-navy); border-radius:0 0 28px 28px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:44px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));
}
.cover .wrap{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:36px; align-items:end}
.kicker{font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--on-navy-muted); margin-bottom:14px}
.cover h1{font-size:clamp(32px,5.8vw,58px); font-weight:800}
.cover h1 em{font-style:normal; color:var(--amber)}
.cover p.lead{color:var(--on-navy-muted); font-size:18px; max-width:54ch; margin-top:18px}
.cover .ctas{display:flex; flex-wrap:wrap; gap:10px; margin-top:24px}
.logo-card{background:#fff; color:#001F4B; border-radius:14px; padding:14px 18px; display:inline-flex; flex-direction:column; margin-top:24px}
.logo-card b{font-family:var(--f-display); font-weight:800; font-size:24px; line-height:1}
.logo-card b span{color:#B88100}
.logo-card small{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; color:#4F5D75; margin-top:4px}
.facts{display:grid; gap:10px; align-content:end}
.fact{border:1px solid rgba(255,255,255,.22); border-radius:14px; padding:14px 16px}
.fact b{display:block; font-family:var(--f-display); font-size:23px; font-weight:800; color:var(--on-navy)}
.fact span{font-size:14px; color:var(--on-navy-muted)}
.pricetag{background:var(--amber); color:var(--on-amber); border-radius:20px; padding:20px 22px}
.pricetag small{display:block; font-weight:600; letter-spacing:.1em; text-transform:uppercase; font-size:12px}
.pricetag .big{font-family:var(--f-display); font-weight:800; font-size:clamp(44px,8vw,68px); line-height:1; font-variant-numeric:tabular-nums}
.pricetag .big sup{font-size:.45em; vertical-align:top; position:relative; top:.15em; margin-right:4px}
.pricetag s{font-weight:600}
.pricetag p{font-size:14px; margin-top:8px}

section.block{padding-block:56px 0}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--accent-txt); margin-bottom:10px}
h2{font-size:clamp(25px,4vw,38px); font-weight:800}
.sub{color:var(--muted); max-width:64ch; margin-top:12px}
.grid{display:grid; gap:14px; margin-top:26px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; min-width:0}
.card h3{font-size:19px; font-weight:800}
.card p{color:var(--muted); margin-top:8px; font-size:15px}
.ico{width:40px; height:40px; border-radius:12px; background:var(--soft); display:grid; place-items:center; margin-bottom:14px; color:var(--accent-txt)}
.ico svg{width:22px; height:22px}

/* Problema -> solución */
.probs{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); margin-top:24px}
.prob{appearance:none; text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:500 15px/1.4 var(--f-body); padding:14px 16px; border-radius:12px; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center}
.prob::after{content:"›"; font-size:22px; color:var(--muted)}
.prob[aria-pressed="true"]{border-color:var(--navy-2); background:var(--soft); box-shadow:inset 3px 0 0 var(--navy-2)}
.probout{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; display:grid; gap:20px; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.probout h3{font-size:20px}
.probout .rec{border-left:1px solid var(--line); padding-left:20px}
.probout .rec p{color:var(--muted); font-size:15px; margin-top:6px}
.probout .row{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
@media (max-width:760px){
  .probout{grid-template-columns:minmax(0,1fr)}
  .probout .rec{border-left:0; padding-left:0; border-top:1px solid var(--line); padding-top:16px}
}

.mod{display:flex; flex-direction:column; gap:14px}
.mod .tag{font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.mod .level{display:flex; gap:4px}
.mod .level i{width:28px; height:6px; border-radius:3px; background:var(--line)}
.mod .level i.on{background:var(--navy-2)}
.mod .btn{margin-top:auto}
ul.ticks{list-style:none; padding:0; margin:0; display:grid; gap:9px}
ul.ticks li{display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; font-size:15px}
ul.ticks svg{width:20px; height:20px; color:var(--ok); margin-top:2px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; cursor:pointer; font:600 15px var(--f-body); padding:12px 18px; border-radius:12px; border:1px solid transparent; appearance:none; text-align:center}
.btn.pri{background:var(--amber); color:var(--on-amber)}
.btn.sec{background:var(--surface); color:var(--ink); border-color:var(--outline)}
.btn.nav{background:var(--navy); color:var(--on-navy)}
.btn.line{background:transparent; color:var(--on-navy); border-color:rgba(255,255,255,.4)}
.btn:hover{filter:brightness(1.05)}
.btn[aria-disabled="true"]{opacity:.45; pointer-events:none}

.inc{display:grid; grid-template-columns:44px minmax(0,1fr); gap:14px; align-items:start}
.inc .n{width:44px; height:44px; border-radius:12px; background:var(--navy); color:var(--on-navy); display:grid; place-items:center}
.inc .n svg{width:22px; height:22px}
.inc.star .n{background:var(--amber); color:var(--on-amber)}
.inc h3{font-size:18px}
.inc p{margin-top:4px}

/* Ruta de implementación */
.steps{display:grid; gap:0; margin-top:26px; counter-reset:s}
.step{display:grid; grid-template-columns:48px minmax(0,1fr); gap:16px; position:relative; padding-bottom:22px}
.step:last-child{padding-bottom:0}
.step::before{content:""; position:absolute; left:23px; top:46px; bottom:0; width:2px; background:var(--line)}
.step:last-child::before{display:none}
.step .dot{width:48px; height:48px; border-radius:50%; background:var(--navy); color:var(--on-navy); font:800 18px var(--f-display); display:grid; place-items:center; counter-increment:s}
.step .dot::before{content:counter(s)}
.step h3{font-size:18px; margin-top:2px}
.step p{color:var(--muted); font-size:15px; margin-top:4px}
.note{font-size:13px; color:var(--muted); margin-top:16px}

/* Ecosistema */
.eco{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); margin-top:24px}
.eco a{display:block; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.eco a:hover{border-color:var(--navy-2)}
.eco a.cur{background:var(--navy); color:var(--on-navy); border-color:var(--navy)}
.eco b{font-family:var(--f-display); font-size:18px; display:block}
.eco span{font-size:14px; color:var(--muted)}
.eco a.cur span{color:var(--on-navy-muted)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.chips span{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:14px; color:var(--muted)}

/* Credibilidad */
.stats{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); margin-top:24px}
.stat{border-top:3px solid var(--navy-2); padding-top:12px}
.stat b{font-family:var(--f-display); font-size:34px; font-weight:800; display:block}
.stat span{color:var(--muted); font-size:15px}
.clients{display:flex; flex-wrap:wrap; gap:8px 10px; margin-top:22px}
.clients span{font:600 14px var(--f-body); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 12px}
.quote{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px}
.quote p{font-size:17px; color:var(--ink); line-height:1.5}
.quote footer{padding:0; margin-top:14px; font-size:14px; color:var(--muted)}
.quote footer b{color:var(--ink)}

details{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:0 18px}
details + details{margin-top:10px}
summary{cursor:pointer; font:800 18px var(--f-display); padding:16px 0; list-style:none; display:flex; justify-content:space-between; gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; font-size:24px; line-height:1; color:var(--accent-txt)}
details[open] summary::after{content:"−"}
details ul{margin:0 0 16px; padding:0}
details > p{color:var(--muted); margin:0 0 16px; font-size:15px}

.scroll{overflow-x:auto; margin-top:26px; border:1px solid var(--line); border-radius:16px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:620px; font-size:15px}
th,td{padding:13px 14px; text-align:center; border-bottom:1px solid var(--line); vertical-align:middle}
th:first-child,td:first-child{text-align:left; width:38%}
thead th{font-family:var(--f-display); font-size:17px; background:var(--navy); color:var(--on-navy)}
thead th.hl{background:var(--navy-2)}
tbody th{text-align:left; font:500 15px var(--f-body)}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody tr:nth-child(even) td,tbody tr:nth-child(even) th{background:color-mix(in srgb,var(--soft) 55%,transparent)}
td svg{width:22px; height:22px; color:var(--ok)}
td .no{color:var(--muted)}
td.price{font-weight:600; font-variant-numeric:tabular-nums}

/* Formulario demo ejecutiva */
.demo{margin-top:26px; display:grid; gap:20px; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.fields{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.fld{display:flex; flex-direction:column; gap:5px; min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:13px; font-weight:600; color:var(--muted)}
.fld input,.fld select,.fld textarea{font:400 15px var(--f-body); color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; min-width:0}
.fld textarea{resize:vertical; min-height:70px}
.preview{display:flex; flex-direction:column; gap:10px; min-width:0}
.preview textarea{flex:1; min-height:180px; font:400 14px/1.5 var(--f-body); color:var(--ink); background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:12px; resize:vertical}
.preview .row{display:flex; flex-wrap:wrap; gap:8px}
.hint{font-size:13px; color:var(--muted)}
@media (max-width:820px){.demo{grid-template-columns:minmax(0,1fr)}}

.contact{background:var(--navy); color:var(--on-navy); border-radius:24px; padding:30px 24px; margin-top:56px}
.contact .eyebrow{color:var(--on-navy-muted)}
.contact h2{color:var(--on-navy)}
.contact .sub{color:var(--on-navy-muted)}
.adv{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); margin-top:24px}
.advc{border:1px solid rgba(255,255,255,.22); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:6px; min-width:0}
.advc b{font-family:var(--f-display); font-size:19px}
.advc span.role{font-size:13px; color:var(--on-navy-muted)}
.advc .num{font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:6px; user-select:all}
.advc .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.advc .btn{padding:9px 12px; font-size:14px}
.lines{display:grid; gap:6px; margin-top:22px; font-size:15px; color:var(--on-navy-muted)}
.lines b{color:var(--on-navy); font-weight:600}
.lines .sel{user-select:all}
.soc{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
.soc a{border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:8px 14px; font-size:14px; text-decoration:none; color:var(--on-navy)}
.soc a:hover{background:rgba(255,255,255,.1)}
footer.foot{padding-block:28px 0; color:var(--muted); font-size:13px}

.fab{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:20; box-shadow:0 6px 24px rgba(0,0,0,.28); border-radius:12px}
.fab .btn{padding:14px 20px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; z-index:30; max-width:90vw}

@media (max-width:760px){
  .cover .wrap{grid-template-columns:minmax(0,1fr)}
  .cover{padding-block:32px 36px}
  section.block{padding-block:44px 0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Videos */
.chip-video{display:inline-flex;align-items:center;gap:8px;margin-top:16px;margin-right:8px;color:var(--on-navy);text-decoration:none;font:600 14px var(--f-body);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px}
.chip-video:hover{background:rgba(255,255,255,.1)}
.chip-video svg{width:16px;height:16px;color:var(--amber)}
.vfeat{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:26px}
.vfeat h3{font-size:clamp(22px,3vw,30px)}
.vfeat .row,.vdemo .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.poster{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--navy-2));text-decoration:none;color:var(--on-navy)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,31,75,.05),rgba(0,31,75,.75))}
.poster .badge{position:absolute;top:12px;left:12px;background:#fff;color:#001F4B;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.poster .lab{position:absolute;left:16px;right:16px;bottom:14px;font:800 clamp(16px,2.6vw,24px) var(--f-display);line-height:1.15}
.poster .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.poster .play svg{width:30px;height:30px;margin-left:3px}
.poster:hover .play{filter:brightness(1.06)}
.vdemo{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.vdemo .play{width:52px;height:52px}
.vdemo .play svg{width:22px;height:22px}

var SOL_Q="", SOL_CAT="";
var SW={}; "que de la el los las un una y o en con para por es se al del lo me mi su como no si a mis tengo quiero necesito sobre".split(" ").forEach(function(w){ SW[w]=1; });
function nz(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," "); }
PROBLEMAS.forEach(function(p){
  p._t=nz(p.t); p._k=nz(p.kw+" "+CATS[p.c]); p._b=nz(p.q+" "+p.ej.join(" ")+" "+(p.n||""));
});
function has(h,t){ return t.length<=3 ? (" "+h+" ").indexOf(" "+t+" ")>=0 : h.indexOf(t)>=0; }
function buscar(q,cat){
  var toks=nz(q).split(/\s+/).filter(function(x){ return x.length>1 && !SW[x]; }).map(function(x){ return x.length>5?x.slice(0,5):x; });
  var out=[];
  PROBLEMAS.forEach(function(p){
    if(cat && p.c!==cat) return;
    if(!toks.length){ out.push({p:p,s:0}); return; }
    var s=0,hit=0;
    toks.forEach(function(t){ var x=has(p._t,t)?3:has(p._k,t)?2:has(p._b,t)?1:0; if(x){ hit++; s+=x; } });
    var need=Math.ceil(toks.length/2);
    if(hit>=need) out.push({p:p,s:s});
  });
  if(toks.length) out.sort(function(a,b){ return b.s-a.s; });
  return out;
}

/* Calculadoras de la guía */
function calcReg(){
  var el=document.getElementById("g-ing"); if(!el) return;
  var v=parseFloat(String(el.value).replace(/[\s,]/g,""));
  document.getElementById("g-uit").textContent=isNaN(v)?"Ingresa un monto en soles.":"Equivale a "+(v/5500).toLocaleString("es-PE",{maximumFractionDigits:1})+" UIT (UIT 2026: S/ 5,500).";
  document.getElementById("g-regres").innerHTML=REG.map(function(r){
    var ok=isNaN(v)?null:(v<=r.max);
    var b=ok===null?'<span class="bd">Sin dato</span>':ok?'<span class="bd ok">Dentro del tope</span>':'<span class="bd no">Excede el tope</span>';
    var tope=r.max===Infinity?"Sin tope de ingresos":"Tope: S/ "+fmt(r.max).replace(/\.00$/,"");
    return '<article class="reg'+(ok===false?" off":"")+'"><div class="regh"><h3>'+r.n+'</h3>'+b+'</div><p class="tope">'+tope+'</p>'+
      '<dl><dt>Impuesto</dt><dd>'+r.tasa+'</dd><dt>Comprobantes</dt><dd>'+r.comp+'</dd><dt>Libros</dt><dd>'+r.libros+'</dd><dt>DJ anual</dt><dd>'+r.dja+'</dd></dl><p class="rn">'+r.nota+'</p></article>';
  }).join("");
}
function calcDet(){
  var o=document.getElementById("d-out"); if(!o) return;
  var imp=parseFloat(String(document.getElementById("d-imp").value).replace(/[\s,]/g,""));
  var d=DET[parseInt(document.getElementById("d-tipo").value,10)||0];
  if(isNaN(imp)||imp<=0){ o.innerHTML="Ingresa el importe total del comprobante."; return; }
  if(imp<=700){ o.innerHTML='<b>No aplica detracción.</b> El importe es menor o igual a S/ 700.'; return; }
  var det=Math.round(imp*d[1]/100);
  o.innerHTML='<span><small>Detracción ('+d[1]+'%)</small><b>S/ '+fmt(det)+'</b></span><span><small>Pago al proveedor</small><b>S/ '+fmt(imp-det)+'</b></span><span><small>Se deposita en</small><b>Banco de la Nación</b></span>';
}
function calcCron(){
  var b=document.getElementById("c-body"); if(!b) return;
  var i=parseInt(document.getElementById("c-dig").value,10)||0, now=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Lima"})), nextDone=false;
  b.innerHTML=CRON.map(function(r){
    var d=new Date(r[2],r[3]-1,r[4][i],23,59,59), past=d<now, st;
    if(past) st='<span class="bd">Vencido</span>';
    else if(!nextDone){ nextDone=true; st='<span class="bd ok">Próximo</span>'; }
    else st='<span class="bd">Pendiente</span>';
    return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td><b>'+r[4][i]+' de '+r[1].split(" ")[0]+'</b></td><td>'+st+'</td></tr>';
  }).join("");
}

/* ---------- Enrutado de vistas y eventos ---------- */
function renderView(v){
  if(v==="general") return renderGeneral();
  if(v==="soluciones") return renderSoluciones();
  if(v==="guia") return renderGuia();
  if(v==="niif18") return renderNiif18();
  return renderMod(v);
}
function afterView(v){
  if(v==="soluciones"){ var q=document.getElementById("sq"); if(q) q.value=SOL_Q; renderSolRes(); }
  if(v==="guia"){ calcReg(); calcDet(); calcCron(); }
  if(v==="niif18") n18Init();
}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="sq"){ SOL_Q=t.value; renderSolRes(); }
  else if(t.id==="g-ing") calcReg();
  else if(t.id==="d-imp") calcDet();
});
document.addEventListener("change",function(e){
  if(e.target.id==="d-tipo") calcDet();
  if(e.target.id==="c-dig") calcCron();
});
document.addEventListener("click",function(e){
  var c=e.target.closest("[data-cat]");
  if(c){ SOL_CAT=c.getAttribute("data-cat"); if(current==="soluciones") renderSolRes(); else { show("soluciones"); } return; }
  var q=e.target.closest("[data-q]");
  if(q){ SOL_Q=q.getAttribute("data-q"); SOL_CAT=""; show("soluciones"); }
});
document.addEventListener("submit",function(e){
  if(e.target.id==="hsearch"){
    var i=document.getElementById("hq"); SOL_Q=i?i.value.trim():""; SOL_CAT=""; show("soluciones");
  }
});

document.addEventListener("change",function(e){

  if(t.id==="n-sel") n18Show();

    var n=document.querySelectorAll(".n18c:checked").length, p=document.getElementById("n18prog");

var tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = VIEWS.map(function(v){ return '<button class="tab" type="button" data-go="'+v+'">'+LABEL[v]+'</button>'; }).join("");

function setFab(v){
  var a = CONTACTO.asesores[0];
  var txt = (v==="general" || !MODS[v]) ? "Hola, quisiera información de EJB Contable." : MODS[v].waTxt;
  document.getElementById("fab").innerHTML = '<a class="btn pri" href="'+wa(a, txt, v)+'" target="_blank" rel="noopener">Hablar con un asesor</a>';
}

function show(v, scrollTop){
  if(VIEWS.indexOf(v) < 0) v = "general";
  current = v;
  app.innerHTML = renderView(v);
  Array.prototype.forEach.call(tabsEl.children, function(b){
    b.setAttribute("aria-current", b.getAttribute("data-go")===v ? "true" : "false");
  });
  setFab(v);
  try{ history.replaceState(null, "", "#"+v); }catch(e){}
  if(scrollTop !== false) window.scrollTo(0,0);
  updateDemo();
  afterView(v);
}

function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2200);
}
function copyText(txt){
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta); toast(ok ? "Copiado" : "No se pudo copiar. Selecciona el texto manualmente.");
  }
  try{ navigator.clipboard.writeText(txt).then(function(){ toast("Copiado"); }, fallback); }catch(e){ fallback(); }
}

document.addEventListener("click", function(e){
  if(e.target.closest("[data-vclose]")){ closeVideoFocus(); return; }
  var vd = e.target.closest("[data-video]");
  if(vd && useModal()){ e.preventDefault(); openVideo(vd.getAttribute("data-video"), vd.getAttribute("data-t"), vd.getAttribute("data-vmode")); return; }
  var go = e.target.closest("[data-go]");
  if(go){ e.preventDefault(); show(go.getAttribute("data-go")); return; }
  var sc = e.target.closest("[data-scroll]");
  if(sc){ e.preventDefault(); var el=document.getElementById(sc.getAttribute("data-scroll")); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  var cp = e.target.closest("[data-copy]");
  if(cp){ copyText(cp.getAttribute("data-copy")); return; }
  if(e.target.closest("#f-copy")){ copyText(document.getElementById("f-msg").value); return; }
  var wab = e.target.closest("#f-wa");
  if(wab && wab.getAttribute("aria-disabled")==="true"){ e.preventDefault(); return; }
  var pr = e.target.closest("[data-prob]");
  if(pr){
    Array.prototype.forEach.call(document.querySelectorAll("[data-prob]"), function(c){ c.setAttribute("aria-pressed", c===pr ? "true":"false"); });
    document.getElementById("probout").innerHTML = probPanel(pr.getAttribute("data-prob"));
  }
});
